<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile - CP Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="profile-page">
    <div class="profile-header">
        <button id="backProfile">←</button>
        <h2>Edit Profile</h2>
    </div>
    <div class="profile-content">
        <img src="images/cp-logo.jpeg" class="profile-photo" alt="Profile">
		<input type="file" id="profileImage" accept="image/*">
        <input type="text" id="newName" placeholder="Enter your name">
        <input type="text" id="newUsername" placeholder="Enter your username">
        <button id="saveProfileBtn">Save Changes</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
