<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="home">
    <div class="top-bar">
        <h2>CP Chat</h2>
        <button id="profileBtn">👤</button>
    </div>
	<!-- Camera Button -->
<button id="cameraTopBtn" class="top-btn">📷</button>
	<!-- More Options Button -->
<button id="menuBtn" class="menu-btn">⋮</button>
<!-- Dropdown Menu -->
<div id="moreMenu" class="more-menu">
    <div class="menu-item" id="newGroupBtn">👥 New Group</div>
    <div class="menu-item" id="broadcastBtn">📢 New Broadcast</div>
    <div class="menu-item" id="starredBtn">⭐ Starred Messages</div>
    <div class="menu-item" id="linkedBtn">📱 Linked Devices</div>
    <div class="menu-item" id="settingsBtn">⚙️ Settings</div>
    <div class="menu-item" id="aboutBtn">ℹ️ About</div>
    <div class="menu-item" id="logoutBtn">🚪 Logout</div>
</div>
    <div class="search-box">
        <input type="text" placeholder="Search chats...">
    </div>
    <div class="chat-list">
        <div class="chat-item" id="alexChat">
            <img class="avatar-img"
			src="users/alex.JPG"
			alt="Alex">
            <div class="chat-info">
                <h3>Alex</h3>
                <p class="status">
    <span class="online-dot"></span>
    Online
</p>
            </div>
            <div class="chat-meta">
    <span>10:45 AM</span>
    <span class="unread-count">1</span>
</div>
        </div>
        <div class="chat-item" id="johnChat">
            <div class="avatar">J</div>
            <div class="chat-info">
                <h3>John</h3>
                <p>See you tomorrow.</p>
            </div>
            <span>Yesterday</span>
        </div>
    </div>
	<div class="bottom-nav">
    <div class="nav-item active" id="chatBtn">
        💬
        <p>Chats</p>
    </div>
    <div class="nav-item" id="contactsBtn">
        👥
        <p>Contacts</p>
    </div>
    <div class="nav-item" id="callsBtn">
        📞
        <p>Calls</p>
    </div>
    <div class="nav-item" id="settingsBtn">
        ⚙️
        <p>Settings</p>
    </div>
	<div class="nav-item" id="updatesBtn">
    📷 
	<p>updates</p>
</div>
</div>
</div>
<button id="newChatBtn" class="new-chat-btn">➕</button>
<button id="newChatBtn" class="new-chat-btn">➕</button>
<script src="script.js"></script>
</body>
</html>
